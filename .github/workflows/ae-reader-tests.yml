name: AE verification lab systems

on:
  push:
    paths:
      - "ae_reader/**"
      - "verifier/**"
      - "fixtures/**"
      - "ufo_lab/**"
      - "ufo_adapter/**"
      - "tests/**"
      - "requirements.txt"
      - "pilot_10_skills.yaml"
      - ".github/workflows/ae-reader-tests.yml"
  pull_request:
    paths:
      - "ae_reader/**"
      - "verifier/**"
      - "fixtures/**"
      - "ufo_lab/**"
      - "ufo_adapter/**"
      - "tests/**"
      - "requirements.txt"
      - "pilot_10_skills.yaml"
      - ".github/workflows/ae-reader-tests.yml"

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Reader self-check
        run: python -m ae_reader.cli self-check
      - name: Reader contract alignment
        run: python -m ae_reader.contract_check
      - name: Verifier contract validation
        run: python -m verifier.cli validate-contract
      - name: Verifier calibration
        run: python -m verifier.cli calibrate
      - name: Fixture specification validation
        run: python -m fixtures.cli validate-specs
      - name: UFO follower plan validation
        run: python -m ufo_lab.cli validate-plans
      - name: UFO plan validation
        run: python -m ufo_adapter.cli validate-plans
      - name: Unit tests
        run: python -m unittest discover -s tests -v
