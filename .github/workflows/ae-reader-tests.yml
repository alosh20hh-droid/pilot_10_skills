name: AE Reader tests

on:
  push:
    paths:
      - "ae_reader/**"
      - "tests/**"
      - ".github/workflows/ae-reader-tests.yml"
  pull_request:
    paths:
      - "ae_reader/**"
      - "tests/**"
      - ".github/workflows/ae-reader-tests.yml"

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reader self-check
        run: python -m ae_reader.cli self-check
      - name: Unit tests
        run: python -m unittest discover -s tests -v
